version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: artifact_bin_app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - mongodb

  mongodb:
    image: mongo:latest
    container_name: artifact_bin_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: aVeryStrongPassPhrase
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
